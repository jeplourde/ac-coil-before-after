<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AC Condenser Coil Cleaning - Before & After</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f4f4;
      color: #222;
    }
    .wrap {
      width: min(900px, 94%);
      margin: 0 auto;
      padding: 28px 0 40px;
    }
    header {
      text-align: center;
      margin-bottom: 24px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 6vw, 46px);
    }
    .subtitle {
      margin: 0;
      color: #555;
      font-size: 18px;
    }
    .card {
      background: white;
      border-radius: 14px;
      padding: 14px;
      margin: 22px 0;
      box-shadow: 0 3px 14px rgba(0,0,0,.10);
    }
    .label {
      text-align: center;
      font-weight: 800;
      font-size: 28px;
      letter-spacing: 2px;
      padding: 6px 0 12px;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 10px;
    }
    footer {
      text-align: center;
      color: #666;
      margin-top: 28px;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>AC Condenser Coil Cleaning</h1>
      <p class="subtitle">See the difference a professional coil cleaning can make.</p>
    </header>

    <section class="card">
      <div class="label">BEFORE</div>
      <img src="before.jpg" alt="Dirty AC condenser coil before cleaning">
    </section>

    <section class="card">
      <div class="label">AFTER</div>
      <img src="after.jpg" alt="Clean AC condenser coil after cleaning">
    </section>

    <footer>
      Wichita Area AC Condenser Coil Cleaning
    </footer>
  </main>
</body>
</html>
